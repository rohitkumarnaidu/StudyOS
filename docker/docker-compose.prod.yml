# StudyOS — Production Docker Compose
# Usage: docker compose -f docker/docker-compose.prod.yml up -d

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    environment:
      STUDYOS_APP_ENV: production
      STUDYOS_LOG_LEVEL: INFO
      STUDYOS_CORS_ORIGINS: "${CORS_ORIGINS:-https://app.studyos.app}"
      STUDYOS_TRUSTED_HOSTS: "${TRUSTED_HOSTS:-api.studyos.app}"
      STUDYOS_DATABASE_URL: "${DATABASE_URL}"
      STUDYOS_JWT_SECRET: "${JWT_SECRET}"
      STUDYOS_JWT_ISSUER: "${JWT_ISSUER:-studyos-api}"
      STUDYOS_REDIS_URL: "${REDIS_URL:-redis://redis:6379/0}"
      STUDYOS_AI_PRIMARY_PROVIDER: "${AI_PROVIDER:-openai}"
      STUDYOS_AI_OPENAI_API_KEY: "${OPENAI_API_KEY}"
      STUDYOS_RATE_LIMIT_DEFAULT: "60/minute"
      STUDYOS_ALLOW_LEGACY_DEMO_BEARER: "false"
      STUDYOS_OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_ENDPOINT:-}"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 256M
          cpus: "0.25"

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_APP_ENV: production
      NEXT_PUBLIC_APP_URL: "${APP_URL:-https://app.studyos.app}"
      NEXT_PUBLIC_API_URL: "${API_URL:-https://api.studyos.app/v1}"
      NEXT_PUBLIC_SUPABASE_URL: "${SUPABASE_URL}"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "${SUPABASE_ANON_KEY}"
      NEXT_PUBLIC_SENTRY_DSN: "${SENTRY_DSN:-}"
      NEXT_PUBLIC_POSTHOG_KEY: "${POSTHOG_KEY:-}"
      NEXT_PUBLIC_POSTHOG_HOST: "${POSTHOG_HOST:-https://us.i.posthog.com}"
      STUDYOS_JWT_SECRET: "${JWT_SECRET}"
      STUDYOS_JWT_ISSUER: "${JWT_ISSUER:-studyos-api}"
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
        reservations:
          memory: 512M
          cpus: "0.5"

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

volumes:
  redis_data:
    driver: local
