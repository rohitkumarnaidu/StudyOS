version: 2
updates:
  # Node.js dependencies (pnpm)
  - package-ecosystem: "npm"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    reviewers:
      - "studyos-team"
    labels:
      - "dependencies"
      - "web"
    commit-message:
      prefix: "chore(web):"
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      nextjs:
        patterns:
          - "next"
          - "@next/*"
      tanstack:
        patterns:
          - "@tanstack/*"

  # Python dependencies (uv)
  - package-ecosystem: "pip"
    directory: "/apps/api"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    reviewers:
      - "studyos-team"
    labels:
      - "dependencies"
      - "api"
    commit-message:
      prefix: "chore(api):"
    groups:
      fastapi:
        patterns:
          - "fastapi"
          - "uvicorn"
          - "starlette"
      pydantic:
        patterns:
          - "pydantic"
          - "pydantic-settings"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "ci-cd"
    commit-message:
      prefix: "ci:"

  # Docker
  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "docker"
    commit-message:
      prefix: "chore(docker):"
