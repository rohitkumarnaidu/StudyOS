name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Security audit (npm)
        run: pnpm audit --audit-level=moderate || true

      - name: Format check
        run: pnpm format:check

      - name: Lint + typecheck + unit tests + build
        run: pnpm turbo run lint typecheck test build --continue

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-coverage
          path: apps/web/coverage/
          retention-days: 7

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.7.12"

      - name: Sync + lint + typecheck + tests
        working-directory: apps/api
        run: |
          uv sync --frozen --all-groups
          uv run ruff check src tests
          uv run ruff format --check src tests
          uv run mypy src
          uv run pytest -q -m "not integration" --cov=studyos_api --cov-report=xml

      - name: Security audit (pip)
        working-directory: apps/api
        run: uv pip audit || true

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-coverage
          path: apps/api/coverage.xml
          retention-days: 7

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build web
        run: pnpm turbo run build --filter=@studyos/web

      - name: Install Playwright browsers
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps

      - name: E2E tests (desktop)
        working-directory: apps/web
        env:
          CI: true
        run: pnpm exec playwright test --project=chromium --project=firefox

      - name: E2E tests (mobile)
        working-directory: apps/web
        env:
          CI: true
        run: pnpm exec playwright test --project=mobile-chrome --project=mobile-safari

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run Trivy vulnerability scanner (API)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: python:3.12-slim
          format: table
          exit-code: 0  # Report only, don't fail
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Run Trivy vulnerability scanner (Web)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: node:20-alpine
          format: table
          exit-code: 0  # Report only, don't fail
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Run Trivy filesystem scan (repo)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: 1  # Fail on critical/high
          severity: CRITICAL,HIGH

  deploy:
    needs: [js, python, e2e, security]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: ${{ github.ref == 'refs/heads/main' && 'staging' || 'production' }}
    steps:
      - uses: actions/checkout@v7

      - name: Deploy to staging
        run: |
          echo "Deploying to staging..."
          # Add actual deploy commands here:
          # - kubectl apply -f k8s/ --namespace=studyos-staging
          # - helm upgrade studyos ./charts/studyos --namespace=studyos-staging
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG_STAGING }}

      - name: Smoke test staging
        run: |
          echo "Running smoke tests against staging..."
          # curl -f https://staging.studyos.app/health

      - name: Deploy to production
        if: github.ref == 'refs/heads/main'
        run: |
          echo "Deploying to production..."
          # Add actual deploy commands here:
          # - kubectl apply -f k8s/ --namespace=studyos-prod
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG_PROD }}
