# StudyOS API — Secrets (must be created externally or via SealedSecrets)
# kubectl create secret generic studyos-api-secrets \
#   --from-literal=STUDYOS_DATABASE_URL=postgresql://... \
#   --from-literal=STUDYOS_JWT_SECRET=... \
#   --from-literal=STUDYOS_AI_OPENAI_API_KEY=... \
#   --from-literal=STUDYOS_REDIS_URL=redis://... \
#   -n studyos
apiVersion: v1
kind: Secret
metadata:
  name: studyos-api-secrets
  namespace: studyos
  labels:
    app.kubernetes.io/name: studyos-api
type: Opaque
stringData:
  STUDYOS_DATABASE_URL: "postgresql://studyos:studyos@postgres:5432/studyos"
  STUDYOS_JWT_SECRET: "change-me-to-a-strong-secret-at-least-32-chars!!"
  STUDYOS_REDIS_URL: "redis://redis:6379/0"
  # AI provider keys (optional)
  STUDYOS_AI_OPENAI_API_KEY: ""
  STUDYOS_AI_ANTHROPIC_API_KEY: ""
