# StudyOS Web — Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: studyos-web
  namespace: studyos
  labels:
    app.kubernetes.io/name: studyos-web
    app.kubernetes.io/version: "0.1.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: studyos-web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: studyos-web
    spec:
      containers:
        - name: web
          image: studyos/web:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
          env:
            - name: NODE_ENV
              value: "production"
            - name: NEXT_PUBLIC_APP_ENV
              value: "production"
            - name: NEXT_PUBLIC_API_URL
              value: "https://api.studyos.app"
          envFrom:
            - secretRef:
                name: studyos-web-secrets
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
